[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "libre-core-autoloader"
version = "0.1.0"
description = "In-development ThinkPad firmware workflow toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.40.0",
    "rich>=13.0",
    "click>=8.0",
    "psutil>=5.9"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "mypy",
    "types-psutil"
]

[project.scripts]
autoloader = "autoloader.__main__:main"

[tool.setuptools.packages.find]
include = ["autoloader*"]
