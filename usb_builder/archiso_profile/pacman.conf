# Arch Linux pacman.conf for Archiso

[options]
HoldPkg     = pacman glibc
Architecture = auto

Color
CheckSpace
VerbosePkgLists
ParallelDownloads = 5

SigLevel    = Required DatabaseRequired
LocalFileSigLevel = Optional

[core]
Server = https://archive.archlinux.org/repos/2026/09/29/$repo/os/$arch

[extra]
Server = https://archive.archlinux.org/repos/2026/09/29/$repo/os/$arch
